[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pub-sub-demo"
version = "0.1.0"
description = "Google Cloud Pub/Sub Enterprise Architecture Demo (Inspired by Anthropic Production Patterns)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-pubsub>=2.19.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-bigquery>=3.17.0",
    "protobuf>=4.25.0",
    "zstandard>=0.22.0",
    "streamlit>=1.31.0",
    "pandas>=2.1.0",
    "altair>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
exclude = ["src/proto_gen/*"]
